<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جبل الرماة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>جبل الرماة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}

/* Layout: ink-wash scroll — misty mountain hero, paper tiles that fill with ink, floating paper tab bar. Daily = indigo ink, weekday-specific = vermilion. Ruqaa for titles, naskh for text, Amiri for hadith and poetry. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#DFE6DD; --line:#D6DFD3;
  --fg:#17221C; --muted:#5F6E66; --accent:#2B6A8A; --on-accent:#FFFFFF; --on-tile:#FFFFFF;
  --accent-soft:#E1EDF2; --brass:#B8322A; --brass-soft:#F6E3DF; --ok:#2F7A4C; --warn:#B8322A; --down:#B8322A;
  --daily:#5E9A5E; --daily2:#2E6542; --special:#C9533A; --special2:#8C2C1E;
  --heat0:#DFE6DD; --heat1:#BFD8BF; --heat2:#8DBB8E; --heat3:#5E9A5E; --heat4:#2E6542;
  --ink1:#2E64AA; --ink2:#173A6B; --mist:#EEF2EC; --trail:#5B8FD0; --horse:#141820; --cloak:#B8322A;
  --glass:rgba(255,255,255,.86);
  --f-display:"Thmanyah Serif Text","Aref Ruqaa","Amiri",serif;
  --f-body:"Thmanyah Serif Text","Noto Naskh Arabic","Segoe UI",serif;
  --f-text:"Amiri","Traditional Arabic","Times New Roman",serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1326; --surface:#111C34; --sunk:#060C19; --line:#22314F;
  --fg:#E8ECF3; --muted:#93A0B8; --accent:#9FC3E8; --on-accent:#0A1326; --on-tile:#FFFFFF;
  --accent-soft:#18284A; --brass:#E8C46A; --brass-soft:#3A3218; --ok:#6CC08A; --warn:#E5705A; --down:#E5705A;
  --daily:#5E9A6E; --daily2:#2B5E44; --special:#D9604A; --special2:#93321F;
  --heat0:#16223A; --heat1:#1F3D3A; --heat2:#2D6150; --heat3:#5E9A6E; --heat4:#A8D8B4;
  --ink1:#6F9BD6; --ink2:#2A4C7E; --mist:#0A1326; --trail:#9FC3E8; --horse:#05070A; --cloak:#E04A40;
  --glass:rgba(17,28,52,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1326; --surface:#111C34; --sunk:#060C19; --line:#22314F;
  --fg:#E8ECF3; --muted:#93A0B8; --accent:#9FC3E8; --on-accent:#0A1326; --on-tile:#FFFFFF;
  --accent-soft:#18284A; --brass:#E8C46A; --brass-soft:#3A3218; --ok:#6CC08A; --warn:#E5705A; --down:#E5705A;
  --daily:#5E9A6E; --daily2:#2B5E44; --special:#D9604A; --special2:#93321F;
  --heat0:#16223A; --heat1:#1F3D3A; --heat2:#2D6150; --heat3:#5E9A6E; --heat4:#A8D8B4;
  --ink1:#6F9BD6; --ink2:#2A4C7E; --mist:#0A1326; --trail:#9FC3E8; --horse:#05070A; --cloak:#E04A40;
  --glass:rgba(17,28,52,.86); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15.5px;font-weight:500;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none;filter:drop-shadow(0 4px 0 var(--sunk))}
.brand h1{font-size:26px;letter-spacing:-.2px}
.brand .dates{font-size:12px;color:var(--muted);line-height:1.35}
.iconbtn{width:44px;height:44px;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);box-shadow:0 4px 0 var(--sunk);transition:transform .12s,box-shadow .12s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sunk)}
.iconbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-block:14px}
section.blk{display:flex;flex-direction:column;gap:12px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.blk-h h2{font-size:23px}
.blk-h .tag{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 5px 0 var(--sunk)}

/* climb */
.mount{background:var(--surface);border:2px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 6px 0 var(--sunk)}
.mount svg{display:block;width:100%;height:auto}
.mount .meta{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.mount .meta .ring{width:70px;height:70px;color:var(--fg);flex:none}
.mount .meta h2{font-size:24px}
.bigstep{font-size:44px;font-weight:800;line-height:1;color:var(--brass)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bob{animation:bob 1.8s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-46px)}}
.cloud{animation:drift 16s ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
.star{animation:twinkle 3s ease-in-out infinite}
.remind{border:2px solid var(--down);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--sunk)}
.remind b.h{color:var(--down);font-size:15px;font-weight:800}
.remind q{font-family:var(--f-text);font-size:20px;line-height:1.8;quotes:"«" "»"}
.up{color:var(--ok)} .dn{color:var(--down)}
.motto{font-family:var(--f-text);font-size:19px;line-height:1.9;margin:0;background:var(--accent-soft);border-radius:var(--r);padding:14px 18px}
.motto small{font-family:var(--f-body);font-size:12.5px;display:block;color:var(--muted)}

/* tiles */
.tiles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:26px;padding:14px;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:start;
  background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 var(--sunk);color:var(--fg);transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .12s;min-width:0}
button.tile:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 var(--sunk)}
.tile.wide{grid-column:1/-1;min-height:0}
.tile.daily{--c1:var(--daily);--c2:var(--daily2)}
.tile.special{--c1:var(--special);--c2:var(--special2)}
.tile.done{background:linear-gradient(155deg,var(--c1),var(--c2));border-color:transparent;color:var(--on-tile);box-shadow:0 6px 0 color-mix(in srgb,var(--c2) 55%,var(--sunk))}
.tile .nm{font-weight:800;font-size:17px;line-height:1.25}
.tile .sb{font-size:12.5px;color:var(--muted);line-height:1.4}
.tile.done .sb{color:var(--on-tile);opacity:.85}
.tile .sb b{color:var(--c1);font-weight:700}
.tile.done .sb b{color:var(--on-tile)}
.tile .sb a{color:inherit}
.tile .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.orb{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--on-tile);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55) 0 10%,transparent 11%),linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 -7px 10px rgba(0,0,0,.28),inset 0 4px 6px rgba(255,255,255,.45),0 6px 12px color-mix(in srgb,var(--c2) 40%,transparent)}
.tile.done .orb{background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.6) 0 10%,transparent 11%),rgba(255,255,255,.22)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;background:color-mix(in srgb,var(--c1) 20%,transparent);color:var(--c1)}
.tile.done .badge{background:rgba(255,255,255,.25);color:var(--on-tile)}
.tick{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent}
.tile.done .tick{border-color:var(--on-tile);background:var(--on-tile);color:var(--c2)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07) rotate(-1.5deg)}70%{transform:scale(.98)}100%{transform:scale(1)}}
.tile.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bigcount{font-size:34px;font-weight:800;line-height:1}
.tile.done .bigcount{color:var(--on-tile)}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:40px;height:40px;border-radius:14px;border:0;font-size:22px;font-weight:800;line-height:1;background:var(--accent-soft);color:var(--fg);box-shadow:0 3px 0 var(--sunk)}
.cnt button:active{transform:translateY(2px);box-shadow:none}
.tile.done .cnt button{background:rgba(255,255,255,.25);color:var(--on-tile);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cnt input{width:64px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:center;font-weight:700;-moz-appearance:textfield;min-width:0}
.tile.done .cnt input{background:rgba(255,255,255,.18);border-color:transparent;color:var(--on-tile)}
.cnt input::-webkit-inner-spin-button{appearance:none}
.pray{display:flex;gap:6px;flex-wrap:wrap}
.pray button{border:0;border-radius:16px;padding:6px 12px;font-weight:700;font-size:13.5px;background:var(--accent-soft);color:var(--fg);box-shadow:0 3px 0 var(--sunk)}
.pray button.on{background:linear-gradient(155deg,var(--c1),var(--c2));color:var(--on-tile)}
.tile.done .pray button{background:rgba(255,255,255,.25);color:var(--on-tile)}
.tile.done .pray button.on{background:var(--on-tile);color:var(--c2)}
.burst{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:20;animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.bob,.cloud,.star,.tile.pop,.burst{animation:none}.burst{display:none}}

/* rows (other screens) */
.list{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 5px 0 var(--sunk)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:2px solid var(--line);min-height:58px;border-inline-start:5px solid transparent}
.row:first-child{border-top:0}
.row.daily{border-inline-start-color:var(--daily)}
.row.special{border-inline-start-color:var(--special)}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:700}
.row.done .t{color:var(--muted)}
.row .s{font-size:12.5px;color:var(--muted);line-height:1.5}
.row .s b{color:var(--brass);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--brass-soft);color:var(--brass);font-weight:700;border:0}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.linkbtn{font-size:13px;color:var(--accent);font-weight:700;background:none;border:0;padding:0}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px;min-height:44px}
textarea.inp{min-height:90px;resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:460px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{white-space:nowrap;border:0;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:9px 18px;font-weight:800;min-height:44px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,var(--sunk));transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--sunk)}
.btn.warn{background:var(--surface);color:var(--warn);border:2px solid var(--warn);box-shadow:0 4px 0 var(--sunk)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:38px;height:38px;border-radius:13px;border:0;background:var(--accent-soft);font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--sunk)}
.stepper input{width:70px;height:38px;border:2px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{appearance:none}

/* progress */
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--special2),var(--special));border-radius:99px}
.bar.brass i{background:linear-gradient(90deg,var(--daily2),var(--daily))}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:22px;height:22px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:10.5px;color:var(--muted);font-weight:700}
.dots span.sch{border:2px solid var(--line);background:transparent}
.dots span.ok{background:linear-gradient(155deg,var(--daily),var(--daily2));color:var(--on-tile)}
.note{background:var(--brass-soft);color:var(--fg);border-radius:16px;padding:12px 14px;font-size:13.5px}
.note b{color:var(--brass)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);gap:4px;direction:rtl;width:max-content}
.heat i{width:15px;height:15px;border-radius:5px;background:var(--heat0)}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--brass);line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles .card{display:flex;flex-direction:column;gap:6px;padding:12px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}}
.metric .v{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1;color:var(--brass)}
.metric .stepper{gap:4px}.metric .stepper button{width:34px;height:36px}.metric .stepper input{width:58px;height:36px;min-width:0}
.metric{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--sunk)}
.metric .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.minibars{display:flex;align-items:flex-end;gap:4px;height:74px;direction:rtl}
.minibars span{flex:1;background:linear-gradient(180deg,var(--special),var(--special2));border-radius:6px 6px 2px 2px;min-height:3px}
.minibars span.over{background:linear-gradient(180deg,var(--warn),var(--down))}
.minibars span.zero{background:var(--sunk)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:11px;text-align:center;color:var(--muted);padding:2px 0;font-weight:700}
.cal button.c{aspect-ratio:1/1.15;max-width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;box-shadow:0 3px 0 var(--sunk)}
.cal button.c.out{opacity:.35}
.cal button.c.today{border-color:var(--brass)}
.cal button.c.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cal .g{font-size:16px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cal .h{font-size:10.5px;color:var(--muted);line-height:1.1}
.cal button.c.sel .h{color:inherit;opacity:.8}
.cal .pips{display:flex;gap:2px;height:7px;align-items:center}
.cal .pips i{width:6px;height:6px;border-radius:50%}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead .t{text-align:center;flex:1}
.calhead .t b{font-family:var(--f-display);font-weight:800;font-size:22px;display:block;line-height:1.3}
.calhead .t span{font-size:12.5px;color:var(--muted)}

/* settings */
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:32px;height:30px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:12.5px;padding:0;font-weight:700}
.days button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.prow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:2px solid var(--line)}
.prow:first-child{border-top:0}
.prow-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:right .18s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 0 var(--sunk)}
.sw.on{background:var(--ok)}
.sw.on::after{right:23px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}

/* floating glass tab bar */
nav.tabs{position:fixed;z-index:6;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:2px solid var(--line);border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:6px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;border-radius:20px}

  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(from===to||reduce){place(to);return}
  const t0=performance.now(),dur=1600;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};

}

  return S.phases.map(p=>{
    const st=key(t)<p.start?"قادم":key(t)>p.end?"منتهٍ":"جارٍ";
    const done=sumItem("hifz",p.start,p.end),left=Math.max(0,p.target-done);
    const from=key(t)>p.start?key(t):p.start;
    const daysLeft=key(t)>p.end?0:wkCount(p,from);
    const need=daysLeft?left/daysLeft:0;
    let adv="";
    if(st!=="منتهٍ"&&left>0){
      const extra=left-daysLeft;
      adv=need>1?`<div class="note">بقي <b class="num">${fmt(left)}</b> وجهًا في <b class="num">${fmt(daysLeft)}</b> يومَ حفظ، أي نحو <b class="num">${(Math.ceil(need*10)/10).toLocaleString("ar-EG")}</b> وجه في اليوم. وجهٌ واحد يوميًا يبلغ <b class="num">${fmt(done+daysLeft)}</b> من ${fmt(p.target)}، فزيدي نصف وجهٍ في <b class="num">${fmt(extra*2)}</b> يومًا منها لتبلغي الستين.</div>`
      :`<div class="note">بقي <b class="num">${fmt(left)}</b> وجهًا في <b class="num">${fmt(daysLeft)}</b> يومَ حفظ، فوجهٌ واحد يوميًا يكفي ويفضل منه للتثبيت.</div>`;
    }
    const months=[];let m=parse(p.start);while(key(m)<=p.end){months.push(new Date(m));m=new Date(m.getFullYear(),m.getMonth()+1,1)}
    return `<section class="blk"><div class="blk-h"><h2>${esc(p.name)}</h2><span class="chip ${st==="جارٍ"?"":"blue"}">${st}</span></div>
    <div class="card stack">
      <div class="small muted">${esc(greg(parse(p.start)))} — ${esc(greg(parse(p.end)))}</div>
      <div class="kv"><span>حفظ القرآن: ${esc(p.quran)}</span><span class="num">${fmt(done)} / ${fmt(p.target)} وجه</span></div>
      <div class="bar brass"><i style="width:${Math.min(100,done/p.target*100)}%"></i></div>
      ${adv}
      <div class="field"><label for="lh_${p.id}">آخر موضعٍ حفظتِه</label><input class="inp" id="lh_${p.id}" data-lh="${p.id}" value="${esc(S.lastHifz[p.id]||"")}" placeholder="مثال: البقرة، الآية ١٤١"></div>
    </div>
    <div class="list">${p.books.map(b=>{
      const tot=+S.totals[b]||0,rd=bookPages(b),days=Object.entries(p.map).filter(([,v])=>v===b).map(([k])=>DAYN[k]).join(" و");
      return `<div class="row" style="flex-wrap:wrap"><div class="txt" style="flex-basis:60%"><div class="t">${esc(BOOKS[b])}</div><div class="s">${esc(days)}</div>
        <div class="bar" style="margin-top:6px"><i style="width:${tot?Math.min(100,rd/tot*100):0}%"></i></div>
        <div class="s num">${tot?`${fmt(rd)} من ${fmt(tot)} صفحة`:`${fmt(rd)} صفحة · حدّدي عدد صفحات الكتاب`}</div></div>
        <div class="field" style="width:96px"><label for="tp_${b}">الصفحات</label><input class="inp num" type="number" min="0" id="tp_${b}" data-tot="${b}" value="${tot||""}"></div></div>`}).join("")}</div>
    <div class="blk-h" style="margin-top:4px"><h3 style="font-size:18px">الاختبارات الشهرية</h3><span class="tag">آخر خميسٍ من كل شهر</span></div>
    <div class="list">${months.map(mm=>{const id=key(mm).slice(0,7),tt=S.tests[id]||{},lt=lastThu(mm);
      return `<div class="row" style="flex-wrap:wrap"><div class="txt" style="flex-basis:50%"><div class="t">${esc(monthName(mm))}</div><div class="s">${esc(DAYN[4])} ${esc(greg(lt))}</div></div>
      <button class="btn ghost" data-act="quizStart" data-m="${id}" data-p="${p.id}">${tt.score!=null?"أعيدي الاختبار":"ابدئي الاختبار"}</button>
      <div class="field" style="width:84px"><label for="ts_${id}">الدرجة ٪</label><input class="inp num" type="number" min="0" max="100" id="ts_${id}" data-test="${id}" data-f="score" value="${tt.score??""}"></div>
      <div class="field" style="flex:1 1 100%"><input class="inp" id="tn_${id}" data-test="${id}" data-f="note" value="${esc(tt.note||"")}" placeholder="مواطن الضعف التي ظهرت في الاختبار"></div></div>`}).join("")}</div>
    </section>`;
  }).join("")+vPrograms();
}

let QZ=null;
function shuffle(a,seed){a=a.slice();let x=seed||Date.now();for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(month,pid){
  const ph=S.phases.find(p=>p.id===pid)||S.phases[0];
  const pool=QBANK.map((q,i)=>({...q,i})).filter(q=>ph.books.includes(q.b));
  const seed=Date.now()%233280;
  const qs=shuffle(pool,seed).slice(0,15).map((q,k)=>({i:q.i,order:shuffle([0,1,2,3],seed+k*7+1)}));
  QZ={month,pid,qs,ans:{},done:false};
}
function vQuiz(){
  if(!QZ)return `<div class="card empty">اختاري الشهر من صفحة الماجستير لتبدئي الاختبار.<br><a href="#masters">إلى الماجستير</a></div>`;
  if(!QZ.qs.length)return `<div class="card empty">لم تُعدّ أسئلة كتب هذا الفصل بعد، وسأضيفها قبل بدايته.<br><a href="#masters">رجوع</a></div>`;
  const mm=parse(QZ.month+"-01");let right=0;
  const body=QZ.qs.map((qq,n)=>{const q=QBANK[qq.i],a=QZ.ans[n];if(QZ.done&&a===0)right++;
    return `<div class="card stack"><div class="small muted">${esc(BOOKS[q.b])} · سؤال ${fmt(n+1)} من ${fmt(QZ.qs.length)}</div><b style="font-size:17px;line-height:1.6">${esc(q.q)}</b>
    <div class="stack" style="gap:6px">${qq.order.map(o=>{const sel=a===o,ok=QZ.done&&o===0,bad=QZ.done&&sel&&o!==0;
      return `<button class="btn ghost" style="text-align:start;white-space:normal;${sel?"border-color:var(--accent);background:var(--accent-soft);":""}${ok?"border-color:var(--ok);color:var(--ok);":""}${bad?"border-color:var(--down);color:var(--down);":""}" data-act="quizPick" data-n="${n}" data-o="${o}" ${QZ.done?"disabled":""}>${esc(q.o[o])}</button>`}).join("")}</div>
    ${QZ.done&&q.x?`<div class="note">${esc(q.x)}</div>`:""}</div>`}).join("");
  const answered=Object.keys(QZ.ans).length,pct=Math.round(right/QZ.qs.length*100);
  return `<section class="blk"><div class="blk-h"><h2>اختبار ${esc(monthName(mm))}</h2><a class="tag" href="#masters">رجوع</a></div>
   ${QZ.done?`<div class="card stack"><span class="small muted">النتيجة</span><span class="bigstep num">${fmt(pct)}٪</span><span>${fmt(right)} من ${fmt(QZ.qs.length)} إجابةً صحيحة، وحُفظت الدرجة في صفحة الماجستير.</span><div class="btns"><button class="btn" data-act="quizRetry">اختبارٌ جديد</button><a class="btn ghost" href="#masters" style="text-decoration:none">رجوع</a></div></div>`:""}
   ${body}
   ${QZ.done?"":`<button class="btn" data-act="quizSubmit" ${answered<QZ.qs.length?'style="opacity:.6"':""}>تسليم الإجابات (${fmt(answered)}/${fmt(QZ.qs.length)})</button>`}</section>`;
}
function weekDots(it){
  const t=today();let h="";
  for(let i=6;i>=0;i--){const d=addDays(t,-i),s=scheduled(it,d),sc=score(it,entry(key(d)));
    h+=`<span class="${sc>=1?"ok":s?"sch":""}" title="${DAYN[d.getDay()]}">${DAYS[d.getDay()]}</span>`}
  return `<div class="dots">${h}</div>`;
}

function weekHarvest(){
  const t=today(),days=[];let ups=0,downs=0;const cat={};
  for(let i=6;i>=0;i--){const d=addDays(t,-i),p=dayPct(d),e=entry(key(d));days.push({k:key(d),p:S.log[key(d)]?p:null});
    if(i>0&&p!==null){if(p>=.7)ups++;else downs++}
    for(const it of dayItems(d)){const c=cat[it.cat]||(cat[it.cat]={s:0,n:0});c.s+=score(it,e);c.n++}}
  const cs=Object.entries(cat).filter(([,v])=>v.n).map(([k,v])=>({k,t:CATS[k],v:v.s/v.n})).sort((a,b)=>b.v-a.v);
  const got=days.filter(x=>x.p!==null);
  return{days,ups,downs,avg:got.length?got.reduce((a,b)=>a+b.p,0)/got.length:0,best:cs[0],weak:cs[cs.length-1]};
}
function harvestHTML(){
  const h=weekHarvest();
  return `<section class="blk"><div class="blk-h"><h2>حصاد الأسبوع</h2><span class="tag">آخر سبعة أيام</span></div><div class="card stack">
   <div class="dots">${h.days.map(x=>`<span class="${x.p===null?"":x.p>=.7?"ok":"sch"}" title="${esc(x.k)}">${DAYS[parse(x.k).getDay()]}</span>`).join("")}</div>
   <div class="kv"><span>معدّل الإنجاز</span><b class="num">${fmt(Math.round(h.avg*100))}٪</b></div>
   <div class="kv"><span>أيام الثبات</span><b class="num up">${fmt(h.ups)}</b></div><div class="kv"><span>أيام النزول</span><b class="num dn">${fmt(h.downs)}</b></div>
   ${h.best?`<div class="kv"><span>أقوى الثغور</span><b>${esc(h.best.t)} · ${fmt(Math.round(h.best.v*100))}٪</b></div>`:""}
   ${h.weak&&h.weak!==h.best?`<div class="note">أضعف الثغور هذا الأسبوع: <b>${esc(h.weak.t)}</b> (${fmt(Math.round(h.weak.v*100))}٪)، فاجعليه همّكِ في الأسبوع المقبل.</div>`:""}</div></section>`;
}
function vLog(){
  const t=today(),weeks=17;let start=addDays(t,-(weeks*7-1));start=addDays(start,-start.getDay());
  let cells="";
  for(let d=new Date(start);d<=t;d=addDays(d,1)){const p=dayPct(d),lv=p===null||!S.log[key(d)]?0:p<.25?1:p<.5?2:p<.85?3:4;
    cells+=`<i style="background:var(--heat${lv})" title="${esc(greg(d))}: ${p===null?"—":Math.round(p*100)+"٪"}"></i>`}
  const avg=n=>{let s=0,c=0;for(let i=0;i<n;i++){const d=addDays(t,-i),p=dayPct(d);if(p!==null&&(S.log[key(d)]||i===0)){s+=p;c++}}return c?Math.round(s/c*100):0};
  const cat=Object.keys(CATS).map(c=>{let s=0,n=0;for(let i=0;i<30;i++){const d=addDays(t,-i),e=entry(key(d));for(const it of dayItems(d).filter(x=>x.cat===c)){s+=score(it,e);n++}}const v=n?Math.round(s/n*100):0;
    return `<div class="stack" style="gap:4px"><div class="kv"><span>${CATS[c]}</span><span class="num">${n?fmt(v)+"٪":"لم يبدأ بعد"}</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`}).join("");
  const notes=Object.entries(S.log).filter(([,e])=>e.note).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  return harvestHTML()+`<div class="tiles"><div class="card"><span class="small muted">التتابع الحالي</span><span class="big num">${fmt(streak())}</span></div>
   <div class="card"><span class="small muted">أطول تتابع</span><span class="big num">${fmt(bestStreak())}</span></div>
   <div class="card"><span class="small muted">معدّل ٧ أيام</span><span class="big num">${fmt(avg(7))}٪</span></div></div>
  <section class="blk"><div class="blk-h"><h2>المقاييس في أسبوعين</h2><span class="tag">من الأقدم إلى اليوم</span></div>

let syncStatus=SY.token?"تعمل":"غير مفعّلة",syncSha=null,pushT=null,syncing=false;
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function ghUrl(){return `https://api.github.com/repos/${SY.repo||"iayshaalharbi48-byte/jabal-data"}/contents/progress.json`}
function ghHeaders(){return{"Authorization":"Bearer "+SY.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function summary(){
  const t=today(),its=dayItems(t),e=entry(key(t)),c=climb(),h=weekHarvest();
  return{date:key(t),pct:dayPct(t)||0,done:its.filter(i=>score(i,e)>=1).length,total:its.length,
    remaining:its.filter(i=>score(i,e)<1).map(i=>i.t),pos:c.prov,summit:SUMMIT,lastResult:c.last??null,
    week:{avg:h.avg,ups:h.ups,downs:h.downs,best:h.best?h.best.t:null,weak:h.weak?h.weak.t:null}};
}
async function syncPull(manual){
  if(!SY.token)return;
  try{syncStatus="جارٍ…";if(route==="prefs")render();
    const r=await fetch(ghUrl()+"?t="+Date.now(),{headers:ghHeaders()});
    if(r.status===404){syncSha=null;await syncPush();return}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();syncSha=j.sha;const remote=JSON.parse(b64d(j.content));
    if(remote&&remote.state&&(remote.state._u||0)>(S._u||0)){S=migrate(remote.state);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}animFrom=null;render();if(manual)toast("جُلب تقدّمكِ المحفوظ")}
    else await syncPush();
  }catch(err){syncStatus=String(err.message)==="401"||String(err.message)==="403"?"الرمز غير صالح":"تعذّر الاتصال";if(route==="prefs")render()}
}
function schedulePush(){if(!SY.token)return;clearTimeout(pushT);pushT=setTimeout(()=>syncPush(),4000)}
async function syncPush(retry){
  if(!SY.token||syncing)return;syncing=true;
  try{const body={message:"تحديث التقدّم",content:b64e(JSON.stringify({updated:Date.now(),summary:summary(),state:S}))};if(syncSha)body.sha=syncSha;
    const r=await fetch(ghUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){const g=await fetch(ghUrl()+"?t="+Date.now(),{headers:ghHeaders()});if(g.ok){syncSha=(await g.json()).sha}syncing=false;return syncPush(true)}
    if(!r.ok)throw new Error(r.status);
    syncSha=(await r.json()).content.sha;syncStatus="آخر مزامنة "+new Date().toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});
  }catch(err){syncStatus=String(err.message)==="401"||String(err.message)==="403"||String(err.message)==="404"?"تحقّقي من الرمز واسم المستودع":"تعذّر الاتصال"}
  syncing=false;if(route==="prefs")render();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncPull(false);else if(SY.token){clearTimeout(pushT);syncPush()}});
window.addEventListener("hashchange",()=>{confirmReset=false;render();window.scrollTo(0,0)});
render();
syncPull(false);
})();
</script>
